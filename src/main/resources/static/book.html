<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book Appointment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <a href="index.html">Home</a>
    <a href="book.html">Book</a>
    <a href="appointments.html">Appointments</a>
    <a href="queue-join.html">Join Queue</a>
</header>

<main>
    <div id="message"></div>

    <div class="card">
        <h2>1. Choose service, staff and date</h2>

        <label>Salon</label>
        <select id="salonSelect"></select>

        <label>Service</label>
        <select id="serviceSelect"></select>

        <label>Staff</label>
        <select id="staffSelect"></select>

        <label>Date</label>
        <input type="date" id="dateInput" required>

        <button type="button" onclick="loadSlots()">Show available slots</button>
    </div>

    <div class="card">
        <h2>2. Pick a time</h2>
        <div id="slots">Choose options above and click "Show available slots".</div>
    </div>

    <div class="card">
        <h2>3. Your details</h2>
        <form id="bookForm">
            <label>Your name</label>
            <input type="text" id="customerName" required>

            <label>Phone</label>
            <input type="text" id="customerPhone" required>

            <p id="chosenSlot">No slot selected.</p>

            <button type="submit">Book appointment</button>
        </form>
    </div>
</main>

<script src="app.js"></script>
<script>
    const salonSelect = document.getElementById('salonSelect');
    const serviceSelect = document.getElementById('serviceSelect');
    const staffSelect = document.getElementById('staffSelect');
    const dateInput = document.getElementById('dateInput');

    let selectedSlot = null; // full value like "2026-10-26T11:00:00"

    // Default the date to today (local time, format yyyy-MM-dd)
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    dateInput.value = `${yyyy}-${mm}-${dd}`;
    dateInput.min = dateInput.value;

    async function loadSalons() {
      try {
        const salons = await api('/salons');
        salonSelect.innerHTML = '';
        salons.forEach(s => {
          salonSelect.innerHTML += `<option value="${s.id}">${s.name}</option>`;
        });
        loadServicesAndStaff();
      } catch (e) {
        showMessage(e.message, 'error');
      }
    }

    async function loadServicesAndStaff() {
      const salonId = salonSelect.value;
      if (!salonId) return;
      try {
        const services = await api('/salons/' + salonId + '/services');
        serviceSelect.innerHTML = '';
        services.forEach(s => {
          serviceSelect.innerHTML +=
            `<option value="${s.id}">${s.name} (${s.durationMinutes} min, ${s.price})</option>`;
        });

        const staffList = await api('/salons/' + salonId + '/staff');
        staffSelect.innerHTML = '';
        staffList.filter(s => s.active).forEach(s => {
          staffSelect.innerHTML += `<option value="${s.id}">${s.name}</option>`;
        });

        clearSlots();
      } catch (e) {
        showMessage(e.message, 'error');
      }
    }

    function clearSlots() {
      selectedSlot = null;
      document.getElementById('slots').textContent = 'Choose options above and click "Show available slots".';
      document.getElementById('chosenSlot').textContent = 'No slot selected.';
    }

    // The API may return slots as "2026-10-26T11:00:00" or just "11:00:00".
    // This turns either one into a full date-time string.
    function toDateTime(slot, date) {
      let value = typeof slot === 'string' ? slot : (slot.startTime || slot.start);
      if (!value.includes('T')) {
        value = date + 'T' + value;
      }
      if (value.length === 16) {
        value += ':00'; // add seconds if missing
      }
      return value;
    }

    async function loadSlots() {
      const salonId = salonSelect.value;
      const serviceId = serviceSelect.value;
      const staffId = staffSelect.value;
      const date = dateInput.value;

      if (!salonId || !serviceId || !staffId || !date) {
        showMessage('Please choose a salon, service, staff member and date', 'error');
        return;
      }

      try {
        const path = `/salons/${salonId}/available-slots?serviceId=${serviceId}&staffId=${staffId}&date=${date}`;
        const slots = await api(path);

        const container = document.getElementById('slots');
        container.innerHTML = '';
        selectedSlot = null;
        document.getElementById('chosenSlot').textContent = 'No slot selected.';

        if (!slots || slots.length === 0) {
          container.textContent = 'No slots available for this day.';
          return;
        }

        slots.forEach(slot => {
          const full = toDateTime(slot, date);
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'slot-btn';
          button.textContent = full.substring(11, 16); // "11:00"
          button.onclick = () => selectSlot(full, button);
          container.appendChild(button);
        });
      } catch (e) {
        showMessage(e.message, 'error');
      }
    }

    function selectSlot(full, button) {
      selectedSlot = full;
      document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
      button.classList.add('selected');
      document.getElementById('chosenSlot').textContent = 'Selected: ' + formatDateTime(full);
    }

    salonSelect.addEventListener('change', loadServicesAndStaff);
    serviceSelect.addEventListener('change', clearSlots);
    staffSelect.addEventListener('change', clearSlots);
    dateInput.addEventListener('change', clearSlots);

    document.getElementById('bookForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      if (!selectedSlot) {
        showMessage('Please pick a time slot first', 'error');
        return;
      }

      const body = {
        customerName: document.getElementById('customerName').value,
        customerPhone: document.getElementById('customerPhone').value,
        serviceId: Number(serviceSelect.value),
        staffId: Number(staffSelect.value),
        startTime: selectedSlot
      };

      try {
        const result = await api('/appointments', 'POST', body);
        showMessage('Booked! Your appointment ID is ' + result.id + ' at ' + formatDateTime(selectedSlot));
        document.getElementById('bookForm').reset();
        loadSlots(); // refresh so the booked slot disappears
      } catch (e) {
        showMessage(e.message, 'error');
        loadSlots(); // in case someone else took the slot
      }
    });

    loadSalons();
</script>
</body>
</html>
